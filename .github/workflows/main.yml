名称：BuildPet: Build EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install pyinstaller pillow pynput
      - name: Build exe
        run: |
          pyinstaller -w -F -n pet shell.py --add-data "main_logic.py;."
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 桌面宠物
          path: dist/
