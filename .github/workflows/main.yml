name: BuildPet
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lib
        run: |
          pip install pyinstaller pillow pynput

      - name: Build exe
        run: |
          pyinstaller -w -F -n pet shell.py

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pet
          path: dist/
