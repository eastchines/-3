name: Build EXE
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyqt5 pynput pyinstaller

      - name: Build EXE
        run: pyinstaller main.py -F -w --noconsole --hidden-import=PyQt5 --hidden-import=PyQt5.QtCore --hidden-import=PyQt5.QtGui --hidden-import=PyQt5.QtWidgets --hidden-import=pynput --collect-all PyQt5

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: pet-exe
          path: dist/main.exe
